
name: Deploy Flask Application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package application
        run: zip -r deployment.zip app.py requirements.txt appspec.yml scripts

      - name: Upload to S3
        run: |
          aws s3 cp deployment.zip \
            "s3://${{ vars.CODEDEPLOY_BUCKET }}/deployment.zip"

      - name: Deploy using CodeDeploy
        run: |
          aws deploy create-deployment \
            --application-name "${{ vars.CODEDEPLOY_APPLICATION }}" \
            --deployment-group-name "${{ vars.CODEDEPLOY_GROUP }}" \
            --s3-location bucket="${{ vars.CODEDEPLOY_BUCKET }}",key=deployment.zip,bundleType=zip
